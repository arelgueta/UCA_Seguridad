name: Build PDFs and Upload to Release

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:

jobs:
  build-latex:
    name: Compilar Cuadernillos LaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Compilar todos los cuadernillos LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Organizar archivos PDF
        run: |
          find . -name "*.pdf" -exec mv {} . \;

      - name: Subir artefacto de PDFs (opcional, para depuración)
        uses: actions/upload-artifact@v4
        with:
          name: Cuadernillos-PDF
          path: "*.pdf"

      - name: Subir PDFs a la Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*.pdf
          asset_name: Cuadernillos.zip
          asset_content_type: application/zip
