name: Build and Upload PDFs to Release

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tex"
      - ".github/workflows/build-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar cuadernillos y publicar PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias de LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-spanish \
            texlive-fonts-recommended

      - name: Compilar los cuadernillos
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tex_files=(C*/UCA_CUADERNILLO*.tex)

          if [ "${#tex_files[@]}" -eq 0 ]; then
            echo "No se encontraron archivos .tex para compilar."
            exit 1
          fi

          for tex_file in "${tex_files[@]}"; do
            dir=$(dirname "$tex_file")
            base=$(basename "$tex_file")
            echo "📄 Compilando $tex_file"

            (
              cd "$dir"
              pdflatex -interaction=nonstopmode -halt-on-error "$base" > /tmp/latex.log 2>&1
            ) || {
              cat /tmp/latex.log || true
              exit 1
            }

            (
              cd "$dir"
              pdflatex -interaction=nonstopmode -halt-on-error "$base" > /tmp/latex.log 2>&1
            ) || {
              cat /tmp/latex.log || true
              exit 1
            }
          done

      - name: Publicar PDFs en la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuadernillos-pdfs
          name: Cuadernillos PDF
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            C*/UCA_CUADERNILLO*.pdf
