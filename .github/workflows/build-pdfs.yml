name: Build PDFs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:

jobs:
  build-latex:
    name: Compilar Cuadernillos LaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Compilar todos los cuadernillos LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Organizar archivos PDF
        run: |
          find . -name "*.pdf" -exec mv {} . \;

      - name: Subir artefacto de PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Cuadernillos-PDF
          path: "*.pdf"
