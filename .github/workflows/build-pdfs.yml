name: Build and Upload PDFs to Release

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tex"
      - ".github/workflows/build-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar cuadernillos y publicar PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-spanish \
            texlive-fonts-recommended

      - name: Compilar todos los cuadernillos
        shell: bash
        run: |
          set -e
          for tex in C*/UCA_CUADERNILLO*.tex; do
            [ -f "$tex" ] || continue
            dir=$(dirname "$tex")
            base=$(basename "$tex")
            echo "📄 Compilando $tex"
            (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error "$base" > /tmp/latex.log 2>&1) || {
              cat /tmp/latex.log || true
              exit 1
            }
            (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error "$base" > /tmp/latex.log 2>&1) || {
              cat /tmp/latex.log || true
              exit 1
            }
          done

      - name: Crear o actualizar release con los PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuadernillos-pdfs
          name: Cuadernillos PDF
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            C*/UCA_CUADERNILLO*.pdf
