name: Build and Upload PDFs to Release

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tex"
      - "**/*.pdf"
      - ".github/workflows/build-pdfs.yml"
  workflow_dispatch:

jobs:
  upload-pdfs:
    name: Subir PDFs a la Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Obtener información de la última Release
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.length === 0) {
              core.setFailed('No hay Releases. Crea una Release primero.');
              return;
            }
            const latestRelease = releases[0];
            core.setOutput('upload_url', latestRelease.upload_url);
            core.info(`📦 Release encontrada: ${latestRelease.tag_name}`);

      - name: Subir cada PDF como asset individual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener la URL de subida
          UPLOAD_URL="${{ steps.get_release.outputs.upload_url }}"
          # Eliminar el sufijo de plantilla para usar la URL base
          BASE_URL="${UPLOAD_URL%\{?name,label\}}"

          echo "📂 Buscando archivos PDF en el repositorio..."
          # Buscar todos los PDFs en las carpetas C* (C1, C2, ... C15)
          find . -type f -path "./C*/*.pdf" | while read -r pdf_path; do
            # Obtener el nombre del archivo
            pdf_name=$(basename "$pdf_path")
            echo "⬆️ Subiendo: $pdf_name desde $pdf_path"
            
            # Subir el archivo usando curl
            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/pdf" \
              --data-binary @"$pdf_path" \
              "${BASE_URL}?name=${pdf_name}"
            
            if [ $? -eq 0 ]; then
              echo "✅ $pdf_name subido correctamente."
            else
              echo "❌ Error al subir $pdf_name"
            fi
          done
