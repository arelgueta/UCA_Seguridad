name: Build PDFs and Upload to Release

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:

jobs:
  build-latex:
    name: Compilar Cuadernillos LaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Compilar todos los cuadernillos LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Organizar archivos PDF
        run: |
          find . -name "*.pdf" -exec mv {} . \;

      - name: Obtener información de la última Release
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.length === 0) {
              core.setFailed('No hay Releases en este repositorio. Crea una Release primero.');
              return;
            }
            const latestRelease = releases[0];
            core.setOutput('upload_url', latestRelease.upload_url);
            core.setOutput('tag_name', latestRelease.tag_name);
            core.info(`Release encontrada: ${latestRelease.tag_name}`);

      - name: Subir cada PDF como asset individual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener la URL de subida de la Release
          UPLOAD_URL="${{ steps.get_release.outputs.upload_url }}"
          
          # Recorrer todos los archivos PDF en el directorio actual
          for pdf in *.pdf; do
            if [ -f "$pdf" ]; then
              echo "Subiendo: $pdf"
              # Usar curl para subir cada PDF como asset individual
              curl -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/pdf" \
                --data-binary @"$pdf" \
                "${UPLOAD_URL%\{?name,label\}}?name=$(basename "$pdf")"
              echo "✅ $pdf subido correctamente"
            fi
          done

      - name: Subir artefacto de PDFs (opcional, para depuración)
        uses: actions/upload-artifact@v4
        with:
          name: Cuadernillos-PDF
          path: "*.pdf"
