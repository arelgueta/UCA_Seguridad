name: Compilar cuadernillos en carpetas y subir a Release

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar repositorio Git
        uses: actions/checkout@v4

      # Compila todos los .tex dentro de las carpetas C2, C3, etc.
      - name: Compilar todos los documentos LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          glob_root_file: true
          work_in_root_file_dir: true

      # Mueve los PDFs a la raíz para empaquetarlos
      - name: Organizar archivos PDF
        run: |
          find . -name "*.pdf" -exec mv {} . \;

      # Guarda los PDFs de forma nativa sin usar la API de Releases bloqueada
      - name: Guardar PDFs como Artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Cuadernillos-PDF
          path: "*.pdf"
