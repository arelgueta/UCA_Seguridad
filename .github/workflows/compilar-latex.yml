name: Compilar cuadernillos en carpetas y subir a Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar repositorio Git
        uses: actions/checkout@v4

      - name: Compilar todos los documentos LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          glob_root_file: true
          work_in_root_file_dir: true

      - name: Organizar archivos PDF
        run: |
          find . -name "*.pdf" -exec mv {} . \;

      # CAMBIO AQUÍ: Usamos el sistema nativo de artefactos de GitHub
      - name: Guardar PDFs como Artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Cuadernillos-PDF
          path: "*.pdf"
