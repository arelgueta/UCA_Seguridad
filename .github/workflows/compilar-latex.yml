name: Compilar cuadernillos en carpetas y subir a Release

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Configurar repositorio Git
        uses: actions/checkout@v4

      # 2. Buscar y compilar CADA archivo .tex dentro de las carpetas C2, C3, etc.
      - name: Compilar todos los documentos LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          # Busca de manera recursiva cualquier archivo .tex en las carpetas
          root_file: "**/*.tex"
          glob_root_file: true
          # Obliga al sistema a compilar parándose dentro de cada carpeta
          work_in_root_file_dir: true

      # 3. Mover todos los PDFs generados a la raíz para que GitHub los encuentre rápido
      - name: Organizar archivos PDF
        run: |
          find . -name "*.pdf" -exec mv {} . \;

      # 4. Adjuntar de manera masiva todos los PDFs a la lista de la Release
      - name: Adjuntar cuadernillos a la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pdf
